# Netlify Configuration for NCDF COOP Commerce Web
# Automatic deployment settings for Next.js App Router

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."release-expired-orders"]
  schedule = "*/5 * * * *"
