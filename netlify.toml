# Netlify Configuration for NCDF COOP Commerce Web
# Automatic deployment settings for Next.js App Router

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=86400, stale-while-revalidate=604800"

[functions."release-expired-orders"]
  schedule = "*/5 * * * *"
